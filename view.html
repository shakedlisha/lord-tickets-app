<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הצעת מחיר | Lord Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1B365D;
            --navy-dark: #0f1f3a;
            --gold: #D4AF37;
            --white: #FFFFFF;
            --gray: #E5E5E5;
            --gray-light: #F8F8F8;
            --success: #28a745;
            --error: #dc3545;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background: var(--gray-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gold);
        }
        
        .main-content {
            flex: 1;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: var(--navy);
            font-size: 1.2rem;
        }
        
        .error-container, .expired-container {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .error-icon, .expired-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .error-title, .expired-title {
            font-size: 1.5rem;
            color: var(--navy);
            margin-bottom: 10px;
        }
        
        .error-message, .expired-message {
            color: #666;
            margin-bottom: 20px;
        }
        
        .proposal-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .proposal-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
            color: var(--white);
            padding: 30px;
            text-align: center;
        }
        
        .proposal-logo {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 10px;
        }
        
        .proposal-title {
            font-size: 1.5rem;
            color: var(--gold);
        }
        
        .proposal-content {
            padding: 30px;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.9rem;
        }
        
        .footer a {
            color: var(--gold);
            text-decoration: none;
        }
        
        .print-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Heebo', sans-serif;
            cursor: pointer;
        }
        
        .print-btn:hover {
            background: var(--navy-dark);
        }
        
        /* Inherit styles from main app for proposal content */
        .proposal-section-title {
            color: var(--navy);
            font-size: 1.3rem;
            margin: 25px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .proposal-section-title:first-child {
            margin-top: 0;
        }
        
        .price-box {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
        }
        
        .price-label {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .price-amount {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gold);
            margin: 10px 0;
        }
        
        .price-validity {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        
        /* Flight timeline styles */
        .flight-timeline-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid var(--gray);
        }
        
        .flight-date-header {
            background: linear-gradient(135deg, #64748B 0%, #475569 100%);
            padding: 14px 24px;
            color: white;
        }
        
        /* Hotel card styles */
        .hotel-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border: 1px solid var(--gray);
        }
        
        @media print {
            .header, .footer, .print-btn {
                display: none !important;
            }
            
            body {
                background: white;
            }
            
            .main-content {
                margin: 0;
                max-width: 100%;
            }
            
            .proposal-container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">✈️ Lord Tickets</div>
    </header>
    
    <main class="main-content">
        <div id="loadingState" class="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">טוען הצעה...</div>
        </div>
        
        <div id="errorState" class="error-container" style="display: none;">
            <div class="error-icon">❌</div>
            <div class="error-title">שגיאה</div>
            <div class="error-message" id="errorMessage">לא ניתן לטעון את ההצעה</div>
        </div>
        
        <div id="expiredState" class="expired-container" style="display: none;">
            <div class="expired-icon">⏰</div>
            <div class="expired-title">ההצעה פגה</div>
            <div class="expired-message">הלינק להצעה זו כבר לא בתוקף.<br>אנא פנה לסוכן לקבלת הצעה מעודכנת.</div>
        </div>
        
        <div id="proposalState" style="display: none;">
            <div class="proposal-container">
                <div class="proposal-header">
                    <div class="proposal-logo">✈️ Lord Tickets</div>
                    <div class="proposal-title">הצעת מחיר</div>
                </div>
                <div class="proposal-content" id="proposalContent">
                    <!-- Proposal content will be loaded here -->
                </div>
            </div>
            <button class="print-btn" onclick="window.print()">🖨️ הדפס / שמור PDF</button>
        </div>
    </main>
    
    <footer class="footer">
        <p>הצעה מ-<a href="index.html">Lord Tickets</a></p>
    </footer>
    
    <script>
        // Get Supabase config from URL or localStorage
        const SUPABASE_URL = localStorage.getItem('supabaseUrl') || '';
        const SUPABASE_KEY = localStorage.getItem('supabaseKey') || '';
        
        async function loadProposal() {
            const urlParams = new URLSearchParams(window.location.search);
            const proposalId = urlParams.get('id');
            
            if (!proposalId) {
                showError('לא צוין מזהה הצעה');
                return;
            }
            
            if (!SUPABASE_URL || !SUPABASE_KEY) {
                showError('הגדרות Supabase חסרות');
                return;
            }
            
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/proposals?id=eq.${proposalId}&select=*`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error('שגיאה בטעינת ההצעה');
                }
                
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    showError('ההצעה לא נמצאה');
                    return;
                }
                
                const proposal = data[0];
                
                // Check if expired
                const expiresAt = new Date(proposal.expires_at);
                if (expiresAt < new Date()) {
                    showExpired();
                    return;
                }
                
                // Show proposal
                showProposal(proposal);
                
            } catch (error) {
                console.error('Error loading proposal:', error);
                showError(error.message);
            }
        }
        
        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorState').style.display = 'block';
        }
        
        function showExpired() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('expiredState').style.display = 'block';
        }
        
        function showProposal(proposal) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('proposalContent').innerHTML = proposal.content;
            document.getElementById('proposalState').style.display = 'block';
            
            // Update page title
            if (proposal.client_name) {
                document.title = `הצעה עבור ${proposal.client_name} | Lord Tickets`;
            }
        }
        
        // Load proposal when page loads
        loadProposal();
    </script>
</body>
</html>
