<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord Tickets - התחברות</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#D4AF37">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    
    <!-- Google Fonts - Heebo for Hebrew -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #E8C547;
            --gold-dark: #B8960C;
            --navy: #1B365D;
            --navy-light: #2A4A7A;
            --navy-dark: #0F1F3A;
            --white: #FFFFFF;
            --gray-light: #F5F5F5;
            --gray: #E0E0E0;
            --gray-dark: #666666;
            --success: #28A745;
            --error: #DC3545;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            padding: 20px;
        }
        
        .login-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        
        .login-header {
            background: var(--navy-dark);
            padding: 40px 30px;
            text-align: center;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .logo-subtitle {
            color: var(--gold-light);
            font-size: 1rem;
            font-weight: 300;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--navy-dark);
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--gray);
            border-radius: 10px;
            font-family: 'Heebo', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        .form-group input[type="email"],
        .form-group input[type="password"] {
            direction: ltr;
            text-align: left;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-family: 'Heebo', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--gold);
            color: var(--navy-dark);
        }
        
        .btn-primary:hover {
            background: var(--gold-light);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--gray);
            color: var(--gray-dark);
            margin-top: 15px;
        }
        
        .btn-outline:hover {
            background: var(--gray-light);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--gray-dark);
            font-size: 0.9rem;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray);
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .settings-section {
            background: var(--gray-light);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .settings-section h3 {
            font-size: 0.9rem;
            color: var(--navy-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .settings-section .form-group {
            margin-bottom: 10px;
        }
        
        .settings-section input {
            font-size: 0.85rem;
            padding: 10px 12px;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--navy-dark);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .skip-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .skip-link a {
            color: var(--gray-dark);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .skip-link a:hover {
            color: var(--navy);
            text-decoration: underline;
        }
        
        .btn-google {
            background: white;
            color: var(--navy-dark);
            border: 2px solid var(--gray);
        }
        
        .btn-google:hover {
            background: var(--gray-light);
            border-color: #4285F4;
        }
        
        .btn-google svg {
            flex-shrink: 0;
        }
        
        .btn-guest {
            background: linear-gradient(135deg, #28A745 0%, #1e7e34 100%);
            color: white;
        }
        
        .btn-guest:hover {
            background: linear-gradient(135deg, #2dbc4e 0%, #28A745 100%);
        }
    </style>
    <script src="js/config.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">Lord Tickets</div>
            <div class="logo-subtitle">מערכת ניהול נוסעים</div>
        </div>
        
        <div class="login-body">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>אימייל</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="material-icons">login</span>
                    התחבר
                </button>
            </form>
            
            <div class="divider"><span>או</span></div>
            
            <button class="btn btn-google" onclick="signInWithGoogle()">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                כניסה עם Google
            </button>
            
            <button class="btn btn-guest" onclick="continueAsGuest()" style="margin-top: 10px;">
                <span class="material-icons">visibility</span>
                כניסה כאורח
            </button>
            
            
            <!-- Supabase settings auto-configured via js/config.js -->
            <input type="hidden" id="supabaseUrl">
            <input type="hidden" id="supabaseKey">
            
        </div>
    </div>
    
    <!-- Pending Approval Screen (hidden by default) -->
    <div class="login-container" id="pendingApprovalScreen" style="display: none;">
        <div class="login-header">
            <div class="logo">Lord Tickets</div>
            <div class="logo-subtitle">מערכת ניהול נוסעים</div>
        </div>
        <div class="login-body" style="text-align: center;">
            <span class="material-icons" style="font-size: 4rem; color: #D4AF37; margin-bottom: 15px;">hourglass_empty</span>
            <h2 style="color: #1B365D; margin-bottom: 10px;">ממתין לאישור מנהל</h2>
            <p style="color: #666; margin-bottom: 20px; line-height: 1.6;">
                החשבון שלך נוצר בהצלחה ומחכה לאישור מנהל המערכת.<br>
                תקבל גישה לאחר שמנהל יאשר את החשבון.
            </p>
            <p id="pendingUserEmail" style="color: #999; font-size: 0.9rem; direction: ltr;"></p>
            <button class="btn btn-outline" onclick="pendingLogout()" style="margin-top: 20px;">
                <span class="material-icons">logout</span>
                התנתק
            </button>
        </div>
    </div>
    
    <script>
        // Load saved settings on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Auto-populate from config (config.js ensures localStorage has the values)
            document.getElementById('supabaseUrl').value = localStorage.getItem('supabaseUrl') || LordConfig.SUPABASE_URL;
            document.getElementById('supabaseKey').value = localStorage.getItem('supabaseKey') || LordConfig.SUPABASE_ANON_KEY;
            
            // Check if already logged in
            const session = localStorage.getItem('userSession');
            const isActive = localStorage.getItem('userIsActive');
            if (session && !window.location.hash) {
                if (isActive === 'false') {
                    // User is pending approval
                    const sessionData = JSON.parse(session);
                    showPendingApproval(sessionData.user?.email || '');
                    return;
                }
                // Already logged in and active, redirect
                window.location.href = 'inventory.html';
                return;
            }
            
            // Handle OAuth callback (tokens in URL hash)
            handleOAuthCallback();
        });
        
        async function handleOAuthCallback() {
            const hash = window.location.hash;
            if (!hash || !hash.includes('access_token')) return;
            
            try {
                // Parse tokens from URL hash
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');
                const expiresIn = params.get('expires_in');
                
                if (!accessToken) return;
                
                const supabaseUrl = localStorage.getItem('supabaseUrl');
                const supabaseKey = localStorage.getItem('supabaseKey');
                
                if (!supabaseUrl || !supabaseKey) {
                    showError('נא להגדיר את Supabase URL ו-API Key לפני כניסה עם Google');
                    return;
                }
                
                // Get user info from Supabase
                const userRes = await fetch(`${supabaseUrl}/auth/v1/user`, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                const userData = await userRes.json();
                
                // Save session
                const expiresAt = Math.floor(Date.now() / 1000) + parseInt(expiresIn || 3600);
                localStorage.setItem('userSession', JSON.stringify({
                    access_token: accessToken,
                    refresh_token: refreshToken,
                    user: userData,
                    expires_at: expiresAt
                }));
                localStorage.setItem('access_token', accessToken);
                localStorage.setItem('refresh_token', refreshToken);
                localStorage.setItem('token_expires_at', String(expiresAt));
                
                // Fetch role from users table
                try {
                    const roleRes = await fetch(
                        `${supabaseUrl}/rest/v1/users?auth_id=eq.${userData.id}&select=id,name,role,commission_rate,is_active`,
                        {
                            headers: {
                                'apikey': supabaseKey,
                                'Authorization': `Bearer ${accessToken}`
                            }
                        }
                    );
                    
                    if (roleRes.ok) {
                        const roleData = await roleRes.json();
                        if (roleData.length > 0) {
                            const user = roleData[0];
                            
                            // Check if user is active
                            if (user.is_active === false) {
                                window.location.hash = '';
                                showPendingApproval(userData.email);
                                return;
                            }
                            
                            localStorage.setItem('userId', user.id);
                            localStorage.setItem('userName', user.name);
                            localStorage.setItem('userRole', user.role);
                            localStorage.setItem('userCommission', user.commission_rate || '0');
                            localStorage.setItem('userIsActive', 'true');
                        } else {
                            // New Google user — auto-create as inactive agent
                            const userName = userData.user_metadata?.full_name || userData.email?.split('@')[0] || 'User';
                            const newUser = {
                                auth_id: userData.id,
                                email: userData.email,
                                name: userName,
                                role: 'agent',
                                is_active: false
                            };
                            
                            try {
                                await fetch(`${supabaseUrl}/rest/v1/users`, {
                                    method: 'POST',
                                    headers: {
                                        'apikey': supabaseKey,
                                        'Authorization': `Bearer ${accessToken}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify(newUser)
                                });
                            } catch (createErr) {
                                console.error('Error creating user record:', createErr);
                            }
                            
                            // Show pending approval screen
                            window.location.hash = '';
                            showPendingApproval(userData.email);
                            return;
                        }
                    }
                } catch (roleErr) {
                    console.error('Error fetching role:', roleErr);
                    localStorage.setItem('userRole', 'agent');
                    localStorage.setItem('userName', userData.user_metadata?.full_name || 'User');
                }
                
                // Clear hash and redirect
                window.location.hash = '';
                showSuccess('התחברות הצליחה! מעביר...');
                setTimeout(() => { window.location.href = 'inventory.html'; }, 1000);
                
            } catch (err) {
                console.error('OAuth callback error:', err);
                showError('שגיאה בכניסה עם Google: ' + err.message);
            }
        }
        
        function signInWithGoogle() {
            const supabaseUrl = document.getElementById('supabaseUrl').value || localStorage.getItem('supabaseUrl');
            const supabaseKey = document.getElementById('supabaseKey').value || localStorage.getItem('supabaseKey');
            
            if (!supabaseUrl || !supabaseKey) {
                showError('נא להזין את הגדרות Supabase לפני כניסה עם Google');
                return;
            }
            
            // Save settings before redirect
            localStorage.setItem('supabaseUrl', supabaseUrl);
            localStorage.setItem('supabaseKey', supabaseKey);
            
            // Redirect to Supabase Google OAuth
            const redirectUrl = window.location.origin + window.location.pathname;
            window.location.href = `${supabaseUrl}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(redirectUrl)}`;
        }
        
        function showPendingApproval(email) {
            // Hide login container, show pending approval screen
            document.querySelector('.login-container:not(#pendingApprovalScreen)').style.display = 'none';
            document.getElementById('pendingApprovalScreen').style.display = 'block';
            document.getElementById('pendingUserEmail').textContent = email || '';
        }
        
        function pendingLogout() {
            localStorage.removeItem('userSession');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userName');
            localStorage.removeItem('userId');
            localStorage.removeItem('userCommission');
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('token_expires_at');
            localStorage.removeItem('userIsActive');
            window.location.reload();
        }
        
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
        }
        
        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
        }
        
        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<div class="spinner"></div> מתחבר...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-icons">login</span> התחבר';
            }
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const supabaseUrl = document.getElementById('supabaseUrl').value || localStorage.getItem('supabaseUrl');
            const supabaseKey = document.getElementById('supabaseKey').value || localStorage.getItem('supabaseKey');
            
            if (!supabaseUrl || !supabaseKey) {
                showError('נא להזין את הגדרות Supabase');
                return;
            }
            
            setLoading(true);
            
            try {
                // Sign in with Supabase Auth
                const response = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error_description || data.msg || 'Login failed');
                }
                
                // Save session (including refresh_token for automatic renewal)
                localStorage.setItem('userSession', JSON.stringify({
                    access_token: data.access_token,
                    refresh_token: data.refresh_token,
                    user: data.user,
                    expires_at: data.expires_at
                }));
                
                // Also save tokens directly for easier access
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                localStorage.setItem('token_expires_at', String(data.expires_at));
                
                // Save settings
                localStorage.setItem('supabaseUrl', supabaseUrl);
                localStorage.setItem('supabaseKey', supabaseKey);
                
                // Fetch user role from users table
                try {
                    const userResponse = await fetch(
                        `${supabaseUrl}/rest/v1/users?auth_id=eq.${data.user.id}&select=id,name,role,commission_rate,is_active`,
                        {
                            headers: {
                                'apikey': supabaseKey,
                                'Authorization': `Bearer ${data.access_token}`
                            }
                        }
                    );
                    
                    if (userResponse.ok) {
                        const userData = await userResponse.json();
                        if (userData.length > 0) {
                            const user = userData[0];
                            
                            // Check if user is active
                            if (user.is_active === false) {
                                showPendingApproval(email);
                                return;
                            }
                            
                            localStorage.setItem('userId', user.id);
                            localStorage.setItem('userName', user.name);
                            localStorage.setItem('userRole', user.role);
                            localStorage.setItem('userCommission', user.commission_rate || '0');
                            localStorage.setItem('userIsActive', 'true');
                        } else {
                            // User exists in Auth but not in users table - create as inactive
                            const userName = email.split('@')[0];
                            try {
                                await fetch(`${supabaseUrl}/rest/v1/users`, {
                                    method: 'POST',
                                    headers: {
                                        'apikey': supabaseKey,
                                        'Authorization': `Bearer ${data.access_token}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        auth_id: data.user.id,
                                        email: email,
                                        name: userName,
                                        role: 'agent',
                                        is_active: false
                                    })
                                });
                            } catch (createErr) {
                                console.error('Error creating user record:', createErr);
                            }
                            
                            showPendingApproval(email);
                            return;
                        }
                    }
                } catch (roleError) {
                    console.error('Error fetching user role:', roleError);
                    localStorage.setItem('userRole', 'agent');
                }
                
                showSuccess('התחברות הצליחה! מעביר...');
                
                setTimeout(() => {
                    window.location.href = 'inventory.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                showError('שגיאה בהתחברות: ' + error.message);
            } finally {
                setLoading(false);
            }
        }
        
        function saveSettings() {
            const url = document.getElementById('supabaseUrl').value;
            const key = document.getElementById('supabaseKey').value;
            
            if (url) localStorage.setItem('supabaseUrl', url);
            if (key) localStorage.setItem('supabaseKey', key);
            
            showSuccess('הגדרות נשמרו בהצלחה');
        }
        
        async function continueAsGuest() {
            const supabaseUrl = document.getElementById('supabaseUrl').value || localStorage.getItem('supabaseUrl');
            const supabaseKey = document.getElementById('supabaseKey').value || localStorage.getItem('supabaseKey');
            
            if (!supabaseUrl || !supabaseKey) {
                // No Supabase configured — use offline guest mode
                localStorage.setItem('userSession', JSON.stringify({
                    user: { email: 'guest@local' },
                    guest: true
                }));
                localStorage.setItem('userRole', 'guest');
                localStorage.setItem('userName', 'אורח');
                localStorage.setItem('userId', 'guest-user');
                window.location.href = 'inventory.html';
                return;
            }
            
            try {
                // Use Supabase anonymous sign-in for a real JWT token
                const response = await fetch(`${supabaseUrl}/auth/v1/signup`, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    localStorage.setItem('userSession', JSON.stringify({
                        access_token: data.access_token,
                        refresh_token: data.refresh_token,
                        user: data.user,
                        expires_at: data.expires_at,
                        guest: true
                    }));
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('token_expires_at', String(data.expires_at));
                    localStorage.setItem('supabaseUrl', supabaseUrl);
                    localStorage.setItem('supabaseKey', supabaseKey);
                } else {
                    // Fallback: use offline guest mode if signup fails
                    localStorage.setItem('userSession', JSON.stringify({
                        user: { email: 'guest@local' },
                        guest: true
                    }));
                }
                
                localStorage.setItem('userRole', 'guest');
                localStorage.setItem('userName', 'אורח');
                localStorage.setItem('userId', 'guest-user');
                window.location.href = 'inventory.html';
                
            } catch (error) {
                console.error('Guest sign-in error:', error);
                // Fallback: offline guest mode
                localStorage.setItem('userSession', JSON.stringify({
                    user: { email: 'guest@local' },
                    guest: true
                }));
                localStorage.setItem('userRole', 'guest');
                localStorage.setItem('userName', 'אורח');
                localStorage.setItem('userId', 'guest-user');
                window.location.href = 'inventory.html';
            }
        }
        
    </script>
</body>
