    <script>
        // ==========================================
        // State Management
        // ==========================================
        const state = {
            apiKey: localStorage.getItem('geminiApiKey') || '',
            model: localStorage.getItem('geminiModel') || 'gemini-1.5-flash',
            flights: [],
            hotels: [],
            services: [], // Manual services (transfers, attractions, etc.)
            savedProposals: JSON.parse(localStorage.getItem('savedProposals') || '[]'),
            currentEditId: null,
            currentEditType: null,
            clientCurrency: localStorage.getItem('clientCurrency') || 'ILS',
            customExchangeRates: JSON.parse(localStorage.getItem('customExchangeRates') || '{}'),
            // Default exchange rates per type/currency (e.g., flight_USD, hotel_EUR)
            defaultRatesByTypeCurrency: JSON.parse(localStorage.getItem('defaultRatesByTypeCurrency') || '{}'),
            // Commission settings
            commissionValue: parseFloat(localStorage.getItem('commissionValue')) || 0,
            commissionType: localStorage.getItem('commissionType') || 'percent', // 'percent' or 'fixed'
            manualPriceOverride: null, // When user manually edits the price
            flightProposalTemplate: localStorage.getItem('flightProposalTemplate') || `*✈️ הצעה לטיסות [יעד] 🇮🇱🇨🇷*

*תאריכים:*
📅 הלוך: [תאריך יציאה]
📅 חזור: [תאריך חזרה]
סה"כ: [מספר לילות]

*טיסות:*
חברת תעופה:
 ✈️ [חברת תעופה]

✈️ *הלוך:*
[מסלול טיסה הלוך עם שעות]
🕒 עצירת ביניים: [יעד עצירה] | [משך עצירה]
[המשך טיסה עם פירוט זמן]
⏳ משך זמן כולל: [סה"כ זמן נסיעה]

✈️ *חזור:*
[מסלול טיסה חזור עם שעות]
🕒 עצירת ביניים: [יעד עצירה] | [משך עצירה]
[המשך טיסה עם פירוט זמן]
⏳ משך זמן כולל: [סה"כ זמן נסיעה]

*כבודה: 🧳*
מזוודה עד [משקל ק"ג] לנוסע
כבודת יד (טרולי)

[פרטי מלונות]

*תנאי ביטול:*
הכרטיס אינו גמיש ויהיה קנס על כל ביטול/שינוי
- במידה וחברת התעופה מבטלת את הטיסה כמובן שהכסף שב אליכם חזרה

*מה אני נותן בתור שירות:*
✅ טיפול בהזמנה וביטולים במידת הצורך
✅ עזרה ותמיכה מתמדת בכל שאלה
✅ חיסכון בעמלות מטבע – אפשרות תשלום בשקלים

💰 *עלות כוללת:*
[מחיר בשקלים]₪ / [מחיר בדולרים]$ עבור נוסע בכרטיס

[הערות נוספות בנוגע לזמינות הכרטיסים או תנאי הכרטוס]

המחיר מוגבל לזמן ואוכל לשריין אותו עבורך. שלח לי את פרטי הדרכונים כדי שאוודא את זמינות העסקה.`
        };
        
        // Default exchange rates relative to USD (base currency)
        // Example: 1 USD = 3.8 ILS, so ILS rate = 1/3.8 = 0.263
        const defaultExchangeRates = {
            USD: 1,
            EUR: 1.08,
            GBP: 1.27,
            THB: 0.027,
            ILS: 0.263  // 1 USD = 3.8 ILS
        };
        
        // Get exchange rate (custom or default)
        function getExchangeRate(currency) {
            if (state.customExchangeRates[currency]) {
                return parseFloat(state.customExchangeRates[currency]);
            }
            return defaultExchangeRates[currency] || 1;
        }
        
        // Currency symbols
        const currencySymbols = {
            USD: '$',
            EUR: '€',
            GBP: '£',
            THB: '฿',
            ILS: '₪'
        };
        
        // Currency conversion function using custom or default rates
        function convertCurrency(amount, fromCurrency, toCurrency, customRate = null) {
            if (!amount || !fromCurrency || !toCurrency) return 0;
            if (fromCurrency === toCurrency) return parseFloat(amount);
            
            // If custom rate provided, use it directly
            if (customRate && fromCurrency !== 'ILS' && toCurrency === 'ILS') {
                return parseFloat(amount) * parseFloat(customRate);
            }
            
            // Convert to USD first, then to target currency
            const fromRate = getExchangeRate(fromCurrency);
            const toRate = getExchangeRate(toCurrency);
            const amountInUSD = parseFloat(amount) / fromRate;
            const amountInTarget = amountInUSD / toRate;
            
            return amountInTarget;
        }
        
        // Format currency
        function formatCurrency(amount, currency) {
            const symbol = currencySymbols[currency] || currency;
            return `${symbol}${parseFloat(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }
        
        // ==========================================
        // Saved Proposals Functions
        // ==========================================
        function toggleSavedProposalsSidebar() {
            const sidebar = document.getElementById('savedProposalsSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        }
        
        function generateProposalTitle() {
            let destination = '';
            let dates = '';
            
            // Get destination from flights or hotels
            if (state.flights.length > 0) {
                const flight = state.flights[0];
                const f = flight.extractedData?.flights?.[0];
                if (f) {
                    destination = f.toCity || f.to || '';
                    dates = f.date || '';
                }
            }
            
            if (!destination && state.hotels.length > 0) {
                const hotel = state.hotels[0];
                const h = hotel.extractedData;
                if (h) {
                    destination = h.location || h.hotelName || '';
                    if (h.checkIn) dates = h.checkIn;
                    if (h.checkIn && h.checkOut) dates = `${h.checkIn} - ${h.checkOut}`;
                }
            }
            
            // Clean up destination
            if (destination.includes(',')) {
                destination = destination.split(',')[0].trim();
            }
            
            return destination ? `${destination} ${dates}`.trim() : `הצעה ${new Date().toLocaleDateString('he-IL')}`;
        }
        
        function saveCurrentProposal() {
            // Check if there's anything to save
            if (state.flights.length === 0 && state.hotels.length === 0 && state.services.length === 0) {
                showToast('❌ אין פריטים לשמירה');
                return;
            }
            
            const totalPrice = parseFloat(document.getElementById('customerPriceInput')?.value) || 0;
            
            const proposal = {
                id: 'proposal_' + Date.now(),
                title: generateProposalTitle(),
                savedAt: new Date().toISOString(),
                totalPrice: totalPrice,
                data: {
                    flights: JSON.parse(JSON.stringify(state.flights)),
                    hotels: JSON.parse(JSON.stringify(state.hotels)),
                    services: JSON.parse(JSON.stringify(state.services)),
                    commissionValue: state.commissionValue,
                    commissionType: state.commissionType
                }
            };
            
            state.savedProposals.unshift(proposal);
            localStorage.setItem('savedProposals', JSON.stringify(state.savedProposals));
            
            renderSavedProposals();
            showToast('💾 ההצעה נשמרה בהצלחה!');
        }
        
        function loadProposal(id) {
            const proposal = state.savedProposals.find(p => p.id === id);
            if (!proposal) return;
            
            // Load the data back
            state.flights = proposal.data.flights || [];
            state.hotels = proposal.data.hotels || [];
            state.services = proposal.data.services || [];
            state.commissionValue = proposal.data.commissionValue || 0;
            state.commissionType = proposal.data.commissionType || 'percent';
            
            // Re-render everything
            renderFlightCards();
            renderHotelCards();
            renderServiceCards();
            updatePricingTable();
            
            // Update commission UI
            document.getElementById('commissionInput').value = state.commissionValue;
            setCommissionType(state.commissionType);
            
            // Close sidebar
            toggleSavedProposalsSidebar();
            
            showToast('📂 ההצעה נטענה בהצלחה!');
        }
        
        function deleteProposal(id, event) {
            event.stopPropagation();
            
            if (!confirm('האם למחוק את ההצעה?')) return;
            
            state.savedProposals = state.savedProposals.filter(p => p.id !== id);
            localStorage.setItem('savedProposals', JSON.stringify(state.savedProposals));
            
            renderSavedProposals();
            showToast('🗑️ ההצעה נמחקה');
        }
        
        function renderSavedProposals() {
            const list = document.getElementById('savedProposalsList');

        function updateApiStatus(connected) {
            const status = document.getElementById('apiStatus');
            status.className = 'api-status' + (connected ? ' connected' : '');
            status.title = connected ? 'מחובר' : 'לא מחובר';
        }
        
        // ==========================================
        // Drop Zone Setup
        // ==========================================
        function setupDropZone(dropZoneId, inputId, type) {
            const dropZone = document.getElementById(dropZoneId);
            const input = document.getElementById(inputId);
            
            dropZone.addEventListener('click', () => input.click());
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files, type);
            });
            
            input.addEventListener('change', (e) => {
                handleFiles(e.target.files, type);
                e.target.value = ''; // Reset for same file selection
            });
        }
        
        // ==========================================
        // File Handling
        // ==========================================
        function handleFiles(files, type) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    addImageCard(file, type);
                }
            });
        }

        }
        
        // ==========================================
        // Image Card Management
        // ==========================================
        function addImageCard(file, type) {
            const id = Date.now() + Math.random().toString(36).substr(2, 9);
            let grid;
            if (type === 'flight') {
                grid = document.getElementById('flightsGrid');
            } else if (type === 'hotel') {
                grid = document.getElementById('hotelsGrid');
            } else {
                grid = document.getElementById('servicesGrid');
            }
            
            // Create image data object
            const imageData = {
                id,
                file,
                type,
                status: 'processing',
                extractedData: null,
                basePrice: 0,
                markup: 0,
                price: 0, // OCR detected price
                currency: type === 'service' ? 'ILS' : 'USD', // Source currency
                customExchangeRate: null // Custom exchange rate to ILS
            };
            
            // Add to state
            if (type === 'flight') {
                state.flights.push(imageData);
            } else if (type === 'hotel') {
                state.hotels.push(imageData);
            } else {
                // For service, add to services with proper structure
                state.services.push({
                    id,
                    type: '',
                    name: '',
                    description: '',
                    price: 0,
                    currency: 'ILS',
                    customExchangeRate: null,
                    status: 'processing',
                    file
                });
            }
            
            // Create card element
            const card = document.createElement('div');
            card.className = 'image-card processing';
            card.id = `card-${id}`;
            
            // Read and display image
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result;
                
                const typeLabels = { flight: 'טיסה', hotel: 'מלון', service: 'שירות' };
                const counts = { flight: state.flights.length, hotel: state.hotels.length, service: state.services.length };
                
                card.innerHTML = `
                    <div class="image-preview">
                        <img src="${base64}" alt="Preview">
                    </div>
                    <div class="image-card-content">
                        <div class="image-card-header">
                            <span class="image-card-title">${typeLabels[type]} #${counts[type]}</span>
                            <button class="delete-btn" onclick="deleteCard('${id}', '${type}')">✕</button>
                        </div>
                        <div class="image-status processing" id="status-${id}">⏳ מעבד...</div>
                        <div class="extracted-summary" id="summary-${id}"></div>
                    </div>
                `;
                
                // Insert before drop zone
                const dropZone = grid.querySelector('.drop-zone-mini');
                grid.insertBefore(card, dropZone);
                
                // Process with Gemini
                await processWithGemini(id, base64, type);
            };
            reader.readAsDataURL(file);
            
            updatePricingTable();
        }
        
        function deleteCard(id, type) {
            // Remove from state
            if (type === 'flight') {
                state.flights = state.flights.filter(f => f.id !== id);
                renderFlightCards();
            } else if (type === 'hotel') {
                state.hotels = state.hotels.filter(h => h.id !== id);
                renderHotelCards();
            } else {
                state.services = state.services.filter(s => s.id !== id);
                renderServiceCards();
            }
            
            // Remove card element (may already be removed by render)
            const card = document.getElementById(`card-${id}`);
            if (card) card.remove();
            
            updatePricingTable();
            showToast('🗑️ התמונה הוסרה');
        }
        
        // ==========================================
        // Gemini Vision API
        // ==========================================
        async function processWithGemini(id, base64Image, type) {
            const statusEl = document.getElementById(`status-${id}`);
            const summaryEl = document.getElementById(`summary-${id}`);
            const card = document.getElementById(`card-${id}`);
            
            if (!state.apiKey) {
                statusEl.className = 'image-status error';
                statusEl.textContent = '❌ חסר מפתח API';
                card.className = 'image-card error';
                return;
            }
            
            try {
                // Remove data URL prefix
                const base64Data = base64Image.split(',')[1];
                
                let prompt;
                if (type === 'flight') {
                    prompt = `Analyze this flight booking screenshot and extract all flight details. 
                       Return a JSON object with this exact structure:
                       {
                         "flights": [
                           {
                             "flightNumber": "XX123",
                             "airline": "Airline Name",
                             "from": "TLV",
                             "fromCity": "Tel Aviv",
                             "to": "BCN", 
                             "toCity": "Barcelona",
                             "date": "15/03/2024",
                             "departureTime": "10:30",
                             "arrivalTime": "14:45",
                             "duration": "4h 15m"
                           }
                         ],
                         "totalPrice": 1500,
                         "currency": "ILS"
                       }
                       Extract all flights shown. If price not visible, set totalPrice to 0.
                       Return ONLY valid JSON, no explanation.`;
                } else if (type === 'hotel') {
                    prompt = `Analyze this hotel booking screenshot and extract all details.
                       Return a JSON object with this exact structure:
                       {
                         "hotelName": "Hotel Name",
                         "location": "City, Country",
                         "checkIn": "15/03/2024",
                         "checkOut": "20/03/2024",
                         "nights": 5,
                         "roomType": "Standard Double",
                         "boardBasis": "Breakfast Included",
                         "rating": 4,
                         "bookingUrl": "https://booking.com/hotel/...",
                         "totalPrice": 2500,
                         "currency": "ILS"
                       }
                       Extract all visible fields. For rating, extract star rating (1-5) if visible. For bookingUrl, extract any booking link, reservation URL, or "Book now" link if visible. If any field not visible, use null. If price not visible, set totalPrice to 0.
                       Return ONLY valid JSON, no explanation.`;
                } else {
                    prompt = `Analyze this service/activity booking screenshot and extract all details.
                       This could be: transfers, tours, attractions, cruises, ski passes, event tickets, etc.
                       Return a JSON object with this exact structure:
                       {
                         "serviceName": "Name of the service/activity",
                         "serviceType": "transfer/tour/attraction/cruise/ski/event/other",
                         "description": "Brief description of the service",
                         "totalPrice": 500,
                         "currency": "ILS"
                       }
                       Extract all visible fields. If price not visible, set totalPrice to 0.
                       Return ONLY valid JSON, no explanation.`;
                }
                
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    {
                                        inline_data: {
                                            mime_type: 'image/jpeg',
                                            data: base64Data
                                        }
                                    }
                                ]
                            }],
                            generationConfig: {
                                temperature: 0.1,
                                maxOutputTokens: 2048
                            }
                        })
                    }
                );
                
                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({}));
                    const errorMessage = errorBody.error?.message || response.statusText || response.status;
                    throw new Error(`API Error ${response.status}: ${errorMessage}`);
                }
                
                const data = await response.json();
                
                // Extract text from response
                let extractedText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                
                // Clean up JSON (remove markdown code blocks if present)
                extractedText = extractedText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                
                // Parse JSON
                let extractedData = JSON.parse(extractedText);
                
                // For hotels, calculate nights automatically and search for Booking.com direct URL
                if (type === 'hotel') {
                    // Calculate nights from check-in and check-out dates
                    if (extractedData.checkIn && extractedData.checkOut && !extractedData.nights) {
                        const nights = calculateNightsBetweenDates(extractedData.checkIn, extractedData.checkOut);
                        if (nights > 0) {
                            extractedData.nights = nights;
                            console.log('Calculated nights:', nights);
                        }
                    }
                    
                    // Create Booking.com search URL with exact hotel name
                    if (extractedData.hotelName) {
                        const hotelName = extractedData.hotelName.trim();
                        // Use quotes around hotel name for exact match search
                        const searchTerm = `"${hotelName}"`;
                        extractedData.bookingUrl = `https://www.booking.com/searchresults.he.html?ss=${encodeURIComponent(searchTerm)}&nflt=ht_id%3D204`; // ht_id=204 filters for hotels only
                        console.log('Created Booking search URL:', extractedData.bookingUrl);
                    }
                }
                
                // Update state
                let items;
                if (type === 'flight') {
                    items = state.flights;
                } else if (type === 'hotel') {
                    items = state.hotels;
                } else {
                    items = state.services;
                }
                const item = items.find(i => i.id === id);
                if (item) {
                    item.status = 'complete';
                    
                    if (type === 'service') {
                        // Service-specific data
                        item.name = extractedData.serviceName || '';
                        item.type = extractedData.serviceType || '';
                        item.description = extractedData.description || '';
                        item.price = extractedData.totalPrice || 0;
                        item.currency = extractedData.currency || 'ILS';
                    } else {
                        item.extractedData = extractedData;
                        item.basePrice = extractedData.totalPrice || 0;
                        // OCR detected price and currency
                        item.price = extractedData.totalPrice || 0;
                        item.currency = extractedData.currency || 'USD';
                    }
                    
                    // Load custom exchange rate from localStorage if exists (per-item)
                    let customRateLoaded = false;
                    try {
                        const key = `${type}_${id}_customRate`;
                        const savedRate = localStorage.getItem(key);
                        if (savedRate && !isNaN(parseFloat(savedRate))) {
                            item.customExchangeRate = parseFloat(savedRate);
                            customRateLoaded = true;
                        }
                    } catch (e) {
                        console.warn('Could not load custom rate from localStorage:', e);
                    }
                    
                    // If no per-item rate, apply default rate for this type/currency
                    if (!customRateLoaded && item.currency !== 'ILS') {
                        const defaultKey = `${type}_${item.currency}`;
                        const defaultRate = state.defaultRatesByTypeCurrency[defaultKey];
                        if (defaultRate) {
                            item.customExchangeRate = defaultRate;
                            console.log(`Auto-applied ${type} ${item.currency} rate: ${defaultRate}`);
                        }
                    }
                }
                
                // Update UI
                card.className = 'image-card complete';
                statusEl.className = 'image-status complete';
                statusEl.textContent = '✅ הושלם';
                
                // Show summary with mini-timeline format
                if (type === 'flight' && extractedData.flights?.length > 0) {
                    const f = extractedData.flights[0];
                    const item = items.find(i => i.id === id);
                    const price = item?.price || 0;
                    const currency = item?.currency || 'USD';
                    const customRate = item?.customExchangeRate || '';
                    const priceInILS = convertCurrency(price, currency, 'ILS', customRate);
                    const priceInForeign = currency !== 'ILS' ? price : priceInILS;
                    
                    console.log('Flight card - Currency:', currency, 'Custom Rate:', customRate, 'Item:', item);
                    
                    summaryEl.innerHTML = `

                            </div>
                        </div>
                        <div class="price-management-section">
                            <div class="price-input-group">
                                <input type="number" class="price-input" id="price-${id}" value="${price}" placeholder="מחיר" onchange="updateItemPrice('${id}', '${type}', this.value)">
                                <select class="currency-select" id="currency-${id}" onchange="updateItemCurrency('${id}', '${type}', this.value)">
                                    <option value="USD" ${currency === 'USD' ? 'selected' : ''}>USD</option>

                                    <option value="GBP" ${currency === 'GBP' ? 'selected' : ''}>GBP</option>
                                    <option value="THB" ${currency === 'THB' ? 'selected' : ''}>THB</option>
                                    <option value="ILS" ${currency === 'ILS' ? 'selected' : ''}>ILS</option>
                                </select>
                            </div>
                            <div class="price-input-group" style="margin-top: 6px;" id="customRateGroup-${id}">
                                <label style="font-size: 0.75rem; color: var(--gray-dark); margin-left: 8px;" id="customRateLabel-${id}">שער חליפין מותאם (${currency !== 'ILS' ? currency + ' → ILS' : 'ILS → מטבע אחר'}):</label>
                                <input type="number" step="0.01" class="price-input" id="customRate-${id}" value="${customRate}" placeholder="לדוגמה: 3.8" style="flex: 0.6;" onchange="updateCustomExchangeRate('${id}', '${type}', this.value)" ${currency === 'ILS' ? 'disabled' : ''}>

                    // Verify custom rate field exists

                    }, 100);
                } else if (type === 'hotel') {
                    const item = items.find(i => i.id === id);
                    const price = item?.price || 0;

        // ==========================================
        // Price Management Functions
        // ==========================================
        function updateItemPrice(id, type, price) {
            const items = type === 'flight' ? state.flights : state.hotels;
            const item = items.find(i => i.id === id);
            if (item) {
                item.price = parseFloat(price) || 0;
                updateConvertedPrice(id, type);
                updatePricingTable();
            }
        }
        
        function updateItemCurrency(id, type, currency) {
            const items = type === 'flight' ? state.flights : state.hotels;
            const item = items.find(i => i.id === id);
            if (item) {
                item.currency = currency;
                
                // Handle currency change
                if (currency === 'ILS') {
                    // Clear custom rate when currency changes to ILS
                    item.customExchangeRate = null;
                    // Remove from localStorage
                    try {
                        const key = `${type}_${id}_customRate`;
                        localStorage.removeItem(key);
                    } catch (e) {
                        console.warn('Could not remove custom rate from localStorage:', e);
                    }
                } else {
                    // Apply default rate for this type/currency if exists
                    const defaultKey = `${type}_${currency}`;
                    const defaultRate = state.defaultRatesByTypeCurrency[defaultKey];
                    if (defaultRate) {
                        item.customExchangeRate = defaultRate;
                    }
                }
                
                // Update custom rate field
                const customRateGroup = document.getElementById(`customRateGroup-${id}`);
                const customRateInput = document.getElementById(`customRate-${id}`);
                const customRateLabel = document.getElementById(`customRateLabel-${id}`);
                
                if (customRateGroup && customRateInput && customRateLabel) {
                    if (currency === 'ILS') {
                        customRateInput.disabled = true;
                        customRateInput.value = '';
                        customRateLabel.textContent = 'שער חליפין מותאם (ILS → מטבע אחר):';
                    } else {
                        customRateInput.disabled = false;
                        customRateLabel.textContent = `שער חליפין מותאם (${currency} → ILS):`;
                        // Fill with default rate if exists
                        const defaultKey = `${type}_${currency}`;
                        const defaultRate = state.defaultRatesByTypeCurrency[defaultKey];
                        customRateInput.value = item.customExchangeRate || defaultRate || '';
                    }
                }
                
                updateConvertedPrice(id, type);
                updatePricingTable();
            }
        }
        
        function updateCustomExchangeRate(id, type, rate) {
            const items = type === 'flight' ? state.flights : state.hotels;
            const item = items.find(i => i.id === id);
            if (item) {
                // Handle empty string or null - set to null if empty
                const parsedRate = (rate && rate !== '' && !isNaN(parseFloat(rate))) ? parseFloat(rate) : null;
                item.customExchangeRate = parsedRate;
                
                // Save to localStorage for persistence (per item)
                try {
                    const key = `${type}_${id}_customRate`;
                    if (item.customExchangeRate) {
                        localStorage.setItem(key, item.customExchangeRate.toString());
                    } else {
                        localStorage.removeItem(key);
                    }
                } catch (e) {
                    console.warn('Could not save custom rate to localStorage:', e);
                }
                
                // Save as default for this type/currency combination
                if (parsedRate && item.currency && item.currency !== 'ILS') {
                    const defaultKey = `${type}_${item.currency}`;
                    state.defaultRatesByTypeCurrency[defaultKey] = parsedRate;
                    localStorage.setItem('defaultRatesByTypeCurrency', JSON.stringify(state.defaultRatesByTypeCurrency));
                    
                    // Apply to all other items of same type with same currency that don't have a custom rate
                    applyDefaultRateToItems(type, item.currency, parsedRate, id);
                }
                
                updateConvertedPrice(id, type);
                updatePricingTable();
                
                const typeName = type === 'flight' ? 'טיסות' : 'מלונות';
                showToast(`✅ שער ${item.currency} עודכן ל-${parsedRate || 'ברירת מחדל'} (יוחל על כל ה${typeName} ב-${item.currency})`);
            }
        }
        
        // Apply default rate to all items of same type/currency
        function applyDefaultRateToItems(type, currency, rate, excludeId = null) {
            const items = type === 'flight' ? state.flights : state.hotels;
            let updatedCount = 0;
            
            items.forEach(item => {
                if (item.id !== excludeId && item.currency === currency && !item.customExchangeRate) {
                    item.customExchangeRate = rate;
                    updatedCount++;
                    
                    // Update the UI input if it exists
                    const rateInput = document.getElementById(`customRate-${item.id}`);
                    if (rateInput) {
                        rateInput.value = rate;
                    }
                    
                    updateConvertedPrice(item.id, type);
                }
            });
            
            return updatedCount;
        }
        
        function updateConvertedPrice(id, type) {
            const items = type === 'flight' ? state.flights : state.hotels;
            const item = items.find(i => i.id === id);
            if (item) {
                const priceInILS = convertCurrency(item.price, item.currency, 'ILS', item.customExchangeRate);
                const priceInForeign = item.currency !== 'ILS' ? item.price : priceInILS;
                const convertedEl = document.getElementById(`converted-${id}`);
                if (convertedEl) {
                    let html = '';
                    if (item.currency !== 'ILS') {
                        html += `<div>${formatCurrency(priceInForeign, item.currency)}</div>`;
                    }
                    html += `<div>${formatCurrency(priceInILS, 'ILS')}</div>`;
                    convertedEl.innerHTML = html;
                }
            }
        }
        
        function updateAllConvertedPrices() {
            state.flights.forEach(item => {
                if (item.status === 'complete') {
                    updateConvertedPrice(item.id, 'flight');
                }
            });
            state.hotels.forEach(item => {
                if (item.status === 'complete') {
                    updateConvertedPrice(item.id, 'hotel');
                }
            });
        }
        
        function updateClientCurrency(currency) {
            state.clientCurrency = currency;
            localStorage.setItem('clientCurrency', currency);
            updateAllConvertedPrices();
            updatePricingTable();
            showToast(`✅ מטבע לקוח עודכן ל-${currency}`);
        }
        
        // ==========================================
        // Pricing Table
        // ==========================================
        function updatePricingTable() {
            const tbody = document.getElementById('pricingTableBody');
            let html = '';
            
            // Add flight rows
            state.flights.forEach((flight, index) => {
                const customRate = flight.customExchangeRate || '';
                const currency = flight.currency || 'ILS';
                const showRateField = currency !== 'ILS';
                // Calculate final price: price converted to ILS + markup
                let finalPrice = 0;
                if (flight.price && flight.currency) {
                    const priceInILS = convertCurrency(flight.price, flight.currency, 'ILS', flight.customExchangeRate);
                    finalPrice = priceInILS + (flight.markup || 0);
                } else {
                    finalPrice = (flight.basePrice || 0) + (flight.markup || 0);
                }
                
                html += `
                    <tr>
                        <td class="item-name">טיסה ${index + 1}${currency !== 'ILS' ? ` (${currency})` : ''}</td>
                        <td><input type="number" step="0.01" value="${flight.basePrice || 0}" onchange="updatePrice('${flight.id}', 'flight', 'base', this.value)"></td>
                        <td><input type="number" step="0.01" value="${flight.markup || 0}" onchange="updatePrice('${flight.id}', 'flight', 'markup', this.value)"></td>
                        <td>
                            ${showRateField ? 
                                `<input type="number" step="0.01" value="${customRate}" placeholder="לדוגמה: 3.8" style="width: 100px;" onchange="updateCustomExchangeRate('${flight.id}', 'flight', this.value)" title="שער חליפין ${currency} → ILS">` : 
                                '<span style="color: #999;">—</span>'
                            }
                        </td>
                        <td class="calculated">₪${finalPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    </tr>
                `;
            });
            
            // Add hotel rows
            state.hotels.forEach((hotel, index) => {
                const customRate = hotel.customExchangeRate || '';
                const currency = hotel.currency || 'ILS';
                const showRateField = currency !== 'ILS';
                // Calculate final price: price converted to ILS + markup
                let finalPrice = 0;
                if (hotel.price && hotel.currency) {
                    const priceInILS = convertCurrency(hotel.price, hotel.currency, 'ILS', hotel.customExchangeRate);
                    finalPrice = priceInILS + (hotel.markup || 0);
                } else {
                    finalPrice = (hotel.basePrice || 0) + (hotel.markup || 0);
                }
                
                html += `
                    <tr>
                        <td class="item-name">מלון ${index + 1}${currency !== 'ILS' ? ` (${currency})` : ''}</td>
                        <td><input type="number" step="0.01" value="${hotel.basePrice || 0}" onchange="updatePrice('${hotel.id}', 'hotel', 'base', this.value)"></td>
                        <td><input type="number" step="0.01" value="${hotel.markup || 0}" onchange="updatePrice('${hotel.id}', 'hotel', 'markup', this.value)"></td>
                        <td>
                            ${showRateField ? 
                                `<input type="number" step="0.01" value="${customRate}" placeholder="לדוגמה: 3.8" style="width: 100px;" onchange="updateCustomExchangeRate('${hotel.id}', 'hotel', this.value)" title="שער חליפין ${currency} → ILS">` : 
                                '<span style="color: #999;">—</span>'
                            }
                        </td>
                        <td class="calculated">₪${finalPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    </tr>
                `;
            });
            
            // Add service rows
            state.services.forEach((service, index) => {
                const currency = service.currency || 'ILS';
                const customRate = service.customExchangeRate || '';
                const showRateField = currency !== 'ILS';
                const finalPrice = convertCurrency(service.price || 0, currency, 'ILS', service.customExchangeRate);
                
                html += `
                    <tr style="background: rgba(212, 175, 55, 0.1);">
                        <td class="item-name">🎫 ${service.name || 'שירות ' + (index + 1)}${currency !== 'ILS' ? ` (${currency})` : ''}</td>
                        <td><input type="number" step="0.01" value="${service.price || 0}" onchange="updateServiceField('${service.id}', 'price', parseFloat(this.value) || 0)"></td>
                        <td style="text-align: center; color: #999;">—</td>
                        <td>
                            ${showRateField ? 
                                `<input type="number" step="0.01" value="${customRate}" placeholder="3.8" style="width: 100px;" onchange="updateServiceField('${service.id}', 'customExchangeRate', parseFloat(this.value) || null)">` : 
                                '<span style="color: #999;">—</span>'
                            }
                        </td>
                        <td class="calculated">₪${finalPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    </tr>
                `;
            });
            
            if (html === '') {
                html = '<tr><td colspan="5" style="text-align: center; color: #999; padding: 20px;">הוסף פריטים ידנית או מתמונה</td></tr>';
            }
            
            tbody.innerHTML = html;
            
            // ==========================================
            // FIXED: Calculate totals with proper currency conversion
            // All values are converted to ILS first, then summed
            // ==========================================
            let totalBaseInILS = 0;      // Base prices converted to ILS
            let totalMarkupInILS = 0;    // Markup (already in ILS)
            let totalCostInILS = 0;      // Total cost to company in ILS
            
            state.flights.forEach(f => {
                // Convert base price to ILS
                let baseInILS = 0;
                if (f.price && f.currency) {
                    baseInILS = convertCurrency(f.price, f.currency, 'ILS', f.customExchangeRate);
                } else {
                    baseInILS = f.basePrice || 0;
                }
                
                totalBaseInILS += baseInILS;
                totalMarkupInILS += f.markup || 0;
                totalCostInILS += baseInILS + (f.markup || 0);
            });
            
            state.hotels.forEach(h => {
                // Convert base price to ILS
                let baseInILS = 0;
                if (h.price && h.currency) {
                    baseInILS = convertCurrency(h.price, h.currency, 'ILS', h.customExchangeRate);
                } else {
                    baseInILS = h.basePrice || 0;
                }
                
                totalBaseInILS += baseInILS;
                totalMarkupInILS += h.markup || 0;
                totalCostInILS += baseInILS + (h.markup || 0);
            });
            
            // Add services to totals
            state.services.forEach(s => {
                const priceInILS = convertCurrency(s.price || 0, s.currency || 'ILS', 'ILS', s.customExchangeRate);
                totalBaseInILS += priceInILS;
                totalCostInILS += priceInILS;
            });
            
            // ==========================================
            // Display totals - all in ILS (properly converted)
            // ==========================================
            
            // Table footer: Base, Markup, Total - all in ILS
            document.getElementById('totalBase').textContent = `₪${totalBaseInILS.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}`;
            document.getElementById('totalMarkup').textContent = `₪${totalMarkupInILS.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}`;
            
            // Total Final (סה"כ) - show in ILS only
            document.getElementById('totalFinal').textContent = `₪${totalCostInILS.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}`;
            
            // ==========================================
            // Commission & Customer Price
            // ==========================================
            const commissionAmount = calculateCommission(totalCostInILS);
            const finalPriceWithCommission = totalCostInILS + commissionAmount;
            
            // Update commission display
            const commissionDisplay = document.getElementById('commissionDisplay');
            if (commissionDisplay) {
                if (state.commissionType === 'percent') {
                    commissionDisplay.textContent = `עמלה (${state.commissionValue}%): ₪${commissionAmount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}`;
                } else {
                    commissionDisplay.textContent = `עמלה: ₪${commissionAmount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}`;
                }
            }
            
            // Customer Price - use manual override if set, otherwise calculated price
            const customerPriceInput = document.getElementById('customerPriceInput');
            if (customerPriceInput) {
                if (state.manualPriceOverride !== null) {
                    customerPriceInput.value = state.manualPriceOverride;
                } else {
                    customerPriceInput.value = Math.round(finalPriceWithCommission);
                }
            }
        }
        
        function updatePrice(id, type, field, value) {
            const items = type === 'flight' ? state.flights : state.hotels;
            const item = items.find(i => i.id === id);
            
            if (item) {
                if (field === 'base') {
                    item.basePrice = parseFloat(value) || 0;
                } else {
                    item.markup = parseFloat(value) || 0;
                }
            }
            
            updatePricingTable();
        }
        
        // ==========================================
        // Commission & Price Functions
        // ==========================================
        function setCommissionType(type) {
            state.commissionType = type;
            localStorage.setItem('commissionType', type);
            
            // Update toggle buttons
            document.getElementById('commissionPercent').classList.toggle('active', type === 'percent');
            document.getElementById('commissionFixed').classList.toggle('active', type === 'fixed');
            
            // Reset manual override when commission type changes
            state.manualPriceOverride = null;
            
            updatePricingTable();
        }
        
        function updateCommission() {
            const value = parseFloat(document.getElementById('commissionValue').value) || 0;
            state.commissionValue = value;
            localStorage.setItem('commissionValue', value);
            
            // Reset manual override when commission changes
            state.manualPriceOverride = null;
            
            updatePricingTable();
        }
        
        function calculateCommission(baseTotal) {
            if (state.commissionType === 'percent') {
                return baseTotal * (state.commissionValue / 100);
            } else {
                return state.commissionValue;
            }
        }
        
        function manualPriceUpdate() {
            const value = parseFloat(document.getElementById('customerPriceInput').value) || 0;
            state.manualPriceOverride = value;
            
            // Update commission display based on new price
            updateCommissionAfterRounding(value);
        }
        
        function roundPrice(increment) {
            const currentPrice = parseFloat(document.getElementById('customerPriceInput').value) || 0;
            const rounded = Math.round(currentPrice / increment) * increment;
            
            document.getElementById('customerPriceInput').value = rounded;
            state.manualPriceOverride = rounded;
            
            // Update commission display based on new rounded price
            updateCommissionAfterRounding(rounded);
        }
        
        function roundToEnding(ending) {
            // Round to numbers ending in specified value (99, 49, etc.)
            // e.g., ending=99: 1299, 1399, 1499, etc.
            // e.g., ending=49: 1249, 1349, 1449, etc.
            const currentPrice = parseFloat(document.getElementById('customerPriceInput').value) || 0;
            
            // Get the base (hundreds) and find the nearest number with the desired ending
            const base = Math.floor(currentPrice / 100) * 100;
            const remainder = currentPrice % 100;
            
            let rounded;
            if (remainder <= ending) {
                // Round down to current hundred + ending
                rounded = base + ending;
            } else {
                // Round up to next hundred + ending
                rounded = base + 100 + ending;
            }
            
            // Make sure we don't round to a number lower than original
            if (rounded < currentPrice) {
                rounded += 100;
            }
            
            document.getElementById('customerPriceInput').value = rounded;
            state.manualPriceOverride = rounded;
            
            // Update commission display based on new rounded price
            updateCommissionAfterRounding(rounded);
            
            showToast(`✅ המחיר עוגל ל-${rounded.toLocaleString()}₪`);
        }
        
        function updateCommissionAfterRounding(roundedPrice) {
            // Calculate the base total (before commission)
            let totalCostInILS = 0;
            
            state.flights.forEach(f => {
                let baseInILS = 0;
                if (f.price && f.currency) {
                    baseInILS = convertCurrency(f.price, f.currency, 'ILS', f.customExchangeRate);
                } else {
                    baseInILS = f.basePrice || 0;
                }
                totalCostInILS += baseInILS + (f.markup || 0);
            });
            
            state.hotels.forEach(h => {
                let baseInILS = 0;
                if (h.price && h.currency) {
                    baseInILS = convertCurrency(h.price, h.currency, 'ILS', h.customExchangeRate);
                } else {
                    baseInILS = h.basePrice || 0;
                }
                totalCostInILS += baseInILS + (h.markup || 0);
            });
            
            state.services.forEach(s => {
                const priceInILS = convertCurrency(s.price || 0, s.currency || 'ILS', 'ILS', s.customExchangeRate);
                totalCostInILS += priceInILS;
            });
            
            // Calculate actual profit from the rounded price
            const actualProfit = roundedPrice - totalCostInILS;
            const profitPercent = totalCostInILS > 0 ? ((actualProfit / totalCostInILS) * 100).toFixed(1) : 0;
            
            // Update commission display to show actual profit
            const commissionDisplay = document.getElementById('commissionDisplay');
            if (commissionDisplay) {
                commissionDisplay.textContent = `עמלה (${profitPercent}%): ₪${actualProfit.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}`;
            }
            
            // Update state commission to reflect actual values
            state.commissionValue = parseFloat(profitPercent);
            state.commissionType = 'percent';
            
            // Update commission input to show the new percentage
            const commissionInput = document.getElementById('commissionValue');
            if (commissionInput) {
                commissionInput.value = profitPercent;
            }
            
            // Update toggle buttons
            document.getElementById('commissionPercent').classList.add('active');
            document.getElementById('commissionFixed').classList.remove('active');
        }
        
        function autoRoundPrice() {
            const currentPrice = parseFloat(document.getElementById('customerPriceInput').value) || 0;
            let rounded;
            
            // Smart rounding: round to a "nice" number
            if (currentPrice < 100) {
                // For small amounts, round to nearest 5
                rounded = Math.round(currentPrice / 5) * 5;
            } else if (currentPrice < 1000) {
                // For medium amounts, round to nearest 10 or nice number ending in 9
                const roundTo10 = Math.round(currentPrice / 10) * 10;
                const roundTo9 = Math.ceil(currentPrice / 10) * 10 - 1; // e.g., 149, 199, 249
                // Choose whichever is closer
                rounded = Math.abs(currentPrice - roundTo10) <= Math.abs(currentPrice - roundTo9) ? roundTo10 : roundTo9;
            } else if (currentPrice < 10000) {
                // For larger amounts, round to nearest 50 or nice number ending in 99
                const roundTo50 = Math.round(currentPrice / 50) * 50;
                const roundTo99 = Math.ceil(currentPrice / 100) * 100 - 1; // e.g., 1999, 2499, 2999
                rounded = Math.abs(currentPrice - roundTo50) <= Math.abs(currentPrice - roundTo99) ? roundTo50 : roundTo99;
            } else {
                // For very large amounts, round to nearest 100
                rounded = Math.round(currentPrice / 100) * 100;
            }
            
            document.getElementById('customerPriceInput').value = rounded;
            state.manualPriceOverride = rounded;
            
            // Update commission display based on new rounded price
            updateCommissionAfterRounding(rounded);
            
            showToast(`✅ המחיר עוגל ל-${rounded.toLocaleString()}₪`);
        }

        function updateFlightField(id, fieldPath, value) {

            if (!flight) return;

            const parts = fieldPath.split('.');
            let obj = flight;
            for (let i = 0; i < parts.length - 1; i++) {
                obj = obj[parts[i]];

            obj[parts[parts.length - 1]] = value;

        // ==========================================
        // Helper Functions for Timeline
        // ==========================================
        function calculateConnection(arrivalTime, departureTime) {
            if (!arrivalTime || !departureTime) return null;
            
            // Parse times like "14:10" and "16:00"
            const arrMatch = arrivalTime.match(/(\d{1,2}):(\d{2})/);
            const depMatch = departureTime.match(/(\d{1,2}):(\d{2})/);
            
            if (!arrMatch || !depMatch) return null;
            
            const [, arrH, arrM] = arrMatch.map(Number);
            const [, depH, depM] = depMatch.map(Number);
            
            let diffMinutes = (depH * 60 + depM) - (arrH * 60 + arrM);
            if (diffMinutes < 0) diffMinutes += 24 * 60; // Next day
            
            const hours = Math.floor(diffMinutes / 60);
            const mins = diffMinutes % 60;
            
            return { 
                hours, 
                mins, 
                total: diffMinutes,
                formatted: hours > 0 ? `${hours}:${mins.toString().padStart(2, '0')}` : `${mins} דקות`,
                isComfortable: diffMinutes >= 90,
                isTight: diffMinutes < 60
            };
        }
        
        function formatHebrewDate(dateStr) {
            if (!dateStr) return '';
            
            // Try to parse various date formats
            let date;
            
            // Format: "05/03/2024" or "5/3/2024"
            const dmyMatch = dateStr.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
            if (dmyMatch) {
                const [, day, month, year] = dmyMatch;
                const fullYear = year.length === 2 ? '20' + year : year;
                date = new Date(fullYear, parseInt(month) - 1, parseInt(day));
            }
            
            if (!date || isNaN(date.getTime())) {
                return dateStr; // Return original if parsing fails
            }
            
            return date.toLocaleDateString('he-IL', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }
        
        function formatShortDate(dateStr) {
            if (!dateStr) return '';
            
            // Parse date and return format like "שׁ 17.01"
            const dmyMatch = dateStr.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
            if (dmyMatch) {
                const [, day, month, year] = dmyMatch;
                const fullYear = year.length === 2 ? '20' + year : year;
                const date = new Date(fullYear, parseInt(month) - 1, parseInt(day));
                
                if (!isNaN(date.getTime())) {
                    const dayOfWeek = date.toLocaleDateString('he-IL', { weekday: 'short' });
                    const dayNum = day.padStart(2, '0');
                    const monthNum = month.padStart(2, '0');
                    return `${dayOfWeek} ${dayNum}.${monthNum}`;
                }
            }
            
            return dateStr;
        }
        
        // Convert display format (DD.MM.YYYY) to HTML date input format (YYYY-MM-DD)
        function dateToInputFormat(dateStr) {
            if (!dateStr) return '';
            const dmyMatch = dateStr.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
            if (dmyMatch) {
                const [, day, month, year] = dmyMatch;
                const fullYear = year.length === 2 ? '20' + year : year;
                return `${fullYear}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
            }
            return '';
        }
        
        // Convert HTML date input format (YYYY-MM-DD) to display format (DD.MM.YYYY)
        function inputFormatToDate(inputStr) {
            if (!inputStr) return '';
            const parts = inputStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return inputStr;
        }
        
        // Get minimum date for flight date picker
        // First flight (outbound): min = today
        // Other flights (return): min = day after first flight's date
        function getMinDateForFlight(flightIndex) {
            const today = new Date().toISOString().split('T')[0];
            
            if (flightIndex === 0) {
                // First flight (outbound) - min is today
                return today;
            } else {
                // Return flight - min is day after first flight's date
                const firstFlight = state.flights[0];
                const firstDateStr = firstFlight?.extractedData?.flights?.[0]?.date;
                
                if (firstDateStr) {
                    const inputFormat = dateToInputFormat(firstDateStr);
                    if (inputFormat) {
                        const firstDate = new Date(inputFormat);
                        firstDate.setDate(firstDate.getDate() + 1); // Add 1 day
                        return firstDate.toISOString().split('T')[0];
                    }
                }
                // Fallback to today if no first flight date
                return today;
            }
        }
        
        // Get minimum date for hotel check-out (day after check-in)
        function getMinDateForCheckOut(checkInStr) {
            const today = new Date().toISOString().split('T')[0];
            
            if (checkInStr) {
                const inputFormat = dateToInputFormat(checkInStr);
                if (inputFormat) {
                    const checkInDate = new Date(inputFormat);
                    checkInDate.setDate(checkInDate.getDate() + 1); // Add 1 day
                    return checkInDate.toISOString().split('T')[0];
                }
            }
            // Fallback to today if no check-in date
            return today;
        }

        // Parse date string for sorting (returns Date object)
        function parseDateForSort(dateStr) {
            if (!dateStr) return new Date(9999, 11, 31); // Put items without dates at the end
            
            dateStr = dateStr.trim();
            
            // Try DD/MM/YYYY or DD.MM.YYYY or DD-MM-YYYY
            let match = dateStr.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
            if (match) {
                let year = parseInt(match[3]);
                if (year < 100) year += 2000;
                return new Date(year, parseInt(match[2]) - 1, parseInt(match[1]));
            }
            
            // Try YYYY-MM-DD
            match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
            if (match) {
                return new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
            }
            
            // Try natural date parsing
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) return d;
            
            return new Date(9999, 11, 31); // Fallback - put at end
        }
        
        // Parse time string for sorting (returns minutes since midnight)
        function parseTimeForSort(timeStr) {
            if (!timeStr) return 0;
            const match = timeStr.match(/(\d{1,2}):(\d{2})/);
            if (match) {
                return parseInt(match[1]) * 60 + parseInt(match[2]);
            }
            return 0;
        }
        
        function calculateNightsBetweenDates(checkInStr, checkOutStr) {
            try {
                if (!checkInStr || !checkOutStr) return 0;
                
                // Parse date string - supports various formats
                const parseDate = (dStr) => {
                    if (!dStr) return null;
                    dStr = dStr.trim();
                    
                    // Try DD/MM/YYYY or DD.MM.YYYY
                    let match = dStr.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
                    if (match) {
                        let year = parseInt(match[3]);
                        if (year < 100) year += 2000;
                        return new Date(year, parseInt(match[2]) - 1, parseInt(match[1]));
                    }
                    
                    // Try YYYY-MM-DD
                    match = dStr.match(/(\d{4})-(\d{2})-(\d{2})/);
                    if (match) {
                        return new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
                    }
                    
                    // Try to parse with Date constructor
                    const d = new Date(dStr);
                    if (!isNaN(d.getTime())) return d;
                    
                    return null;
                };
                
                const checkIn = parseDate(checkInStr);
                const checkOut = parseDate(checkOutStr);
                
                if (!checkIn || !checkOut) return 0;
                
                const diffTime = checkOut.getTime() - checkIn.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                return diffDays > 0 ? diffDays : 0;
            } catch (e) {
                console.error('Error calculating nights:', e);
                return 0;
            }
        }
        
        function calculateDateGap(date1Str, time1Str, date2Str, time2Str) {
            try {
                if (!date1Str || !date2Str) return 0;
                
                // Helper to parse date string "DD/MM/YYYY" or similar
                const parseDate = (dStr) => {
                    const parts = dStr.match(/(\d+)[^\d](\d+)[^\d](\d+)/);
                    if (parts) {
                        // Assuming DD/MM/YYYY
                        return new Date(parts[3], parts[2] - 1, parts[1]);
                    }
                    return new Date(dStr);
                };

                const d1 = parseDate(date1Str);
                const d2 = parseDate(date2Str);
                
                // Add time if available
                if (time1Str) {
                    const t1Parts = time1Str.match(/(\d+):(\d+)/);
                    if (t1Parts) d1.setHours(parseInt(t1Parts[1]), parseInt(t1Parts[2]));
                }
                
                if (time2Str) {
                    const t2Parts = time2Str.match(/(\d+):(\d+)/);
                    if (t2Parts) d2.setHours(parseInt(t2Parts[1]), parseInt(t2Parts[2]));
                }
                
                const diffMs = d2 - d1;
                return diffMs / (1000 * 60 * 60); // Return hours
            } catch (e) {
                console.error("Error calculating date gap", e);
                return 0;
            }
        }

        /**
         * Fix date rollover for a single flight segment.
         * If arrival_time < departure_time (and it's not a timezone issue), 
         * assume arrival is the next day.
         */
        function fixSegmentDateRollover(segment) {
            if (!segment.date || !segment.departureTime || !segment.arrivalTime) {
                return segment;
            }
            
            // Parse times
            const depMatch = segment.departureTime.match(/(\d{1,2}):(\d{2})/);
            const arrMatch = segment.arrivalTime.match(/(\d{1,2}):(\d{2})/);
            
            if (!depMatch || !arrMatch) {
                return segment;
            }
            
            const depHours = parseInt(depMatch[1]);
            const depMinutes = parseInt(depMatch[2]);
            const arrHours = parseInt(arrMatch[1]);
            const arrMinutes = parseInt(arrMatch[2]);
            
            // Convert to minutes since midnight
            const depTotalMinutes = depHours * 60 + depMinutes;
            const arrTotalMinutes = arrHours * 60 + arrMinutes;
            
            // If arrival time is earlier than departure time, it's likely the next day
            // (unless it's a very short flight, which we'll handle separately)
            if (arrTotalMinutes < depTotalMinutes) {
                // Calculate flight duration
                const flightDuration = (24 * 60 - depTotalMinutes) + arrTotalMinutes;
                
                // If flight duration is reasonable (less than 24 hours), it's a midnight crossover
                if (flightDuration < 24 * 60) {
                    // Parse the departure date
                    const dateMatch = segment.date.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
                    if (dateMatch) {
                        let year = parseInt(dateMatch[3]);
                        if (year < 100) year += 2000;
                        const month = parseInt(dateMatch[2]) - 1;
                        const day = parseInt(dateMatch[1]);
                        
                        // Create arrival date (next day)
                        const depDate = new Date(year, month, day);
                        const arrDate = new Date(depDate);
                        arrDate.setDate(arrDate.getDate() + 1);
                        
                        // Format arrival date as DD/MM/YYYY
                        const arrDay = String(arrDate.getDate()).padStart(2, '0');
                        const arrMonth = String(arrDate.getMonth() + 1).padStart(2, '0');
                        const arrYear = arrDate.getFullYear();
                        segment.arrivalDate = `${arrDay}/${arrMonth}/${arrYear}`;
                    }
                }
            }
            
            return segment;
        }
        
        /**
         * Validate and fix flight chain: ensure each leg's departure is after previous leg's arrival.
         * If not, increment the departure date.
         */
        function validateAndFixFlightChain(segments) {
            if (!segments || segments.length < 2) {
                return segments;
            }
            
            // First, fix date rollover for each segment individually
            segments = segments.map(seg => fixSegmentDateRollover(seg));
            
            // Now validate the chain
            for (let i = 0; i < segments.length - 1; i++) {
                const current = segments[i];
                const next = segments[i + 1];
                
                // Skip if dates or times are missing
                if (!current.date || !current.arrivalTime || !next.date || !next.departureTime) {
                    continue;
                }
                
                // Parse dates and times
                const parseDate = (dStr) => {
                    const match = dStr.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
                    if (match) {
                        let year = parseInt(match[3]);
                        if (year < 100) year += 2000;
                        return new Date(year, parseInt(match[2]) - 1, parseInt(match[1]));
                    }
                    return null;
                };
                
                const parseTime = (tStr) => {
                    const match = tStr.match(/(\d{1,2}):(\d{2})/);
                    if (match) {
                        return {
                            hours: parseInt(match[1]),
                            minutes: parseInt(match[2]),
                            totalMinutes: parseInt(match[1]) * 60 + parseInt(match[2])
                        };
                    }
                    return null;
                };
                
                const currentArrDate = parseDate(current.arrivalDate || current.date);
                const nextDepDate = parseDate(next.date);
                const currentArrTime = parseTime(current.arrivalTime);
                const nextDepTime = parseTime(next.departureTime);
                
                if (!currentArrDate || !nextDepDate || !currentArrTime || !nextDepTime) {
                    continue;
                }
                
                // Create full datetime objects
                const currentArrival = new Date(currentArrDate);
                currentArrival.setHours(currentArrTime.hours, currentArrTime.minutes, 0, 0);
                
                const nextDeparture = new Date(nextDepDate);
                nextDeparture.setHours(nextDepTime.hours, nextDepTime.minutes, 0, 0);
                
                // If next departure is before current arrival, increment next departure date
                if (nextDeparture < currentArrival) {
                    // Calculate how many days to add
                    const diffMs = currentArrival - nextDeparture;
                    const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                    
                    const newDepDate = new Date(nextDepDate);
                    newDepDate.setDate(newDepDate.getDate() + diffDays);
                    
                    // Format new date as DD/MM/YYYY
                    const newDay = String(newDepDate.getDate()).padStart(2, '0');
                    const newMonth = String(newDepDate.getMonth() + 1).padStart(2, '0');
                    const newYear = newDepDate.getFullYear();
                    next.date = `${newDay}/${newMonth}/${newYear}`;
                    
                    console.log(`Fixed chain: Leg ${i + 1} departure date incremented to ${next.date}`);
                }
            }
            
            return segments;
        }
        
        /**
         * Get ISO timestamp for a flight segment (for sorting).
         * Returns a Date object representing the departure datetime.
         */
        function getSegmentISOTimestamp(segment) {
            if (!segment.date || !segment.departureTime) {
                return new Date(9999, 11, 31); // Put items without dates at the end
            }
            
            // Parse date
            const dateMatch = segment.date.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
            if (!dateMatch) {
                return new Date(9999, 11, 31);
            }
            
            let year = parseInt(dateMatch[3]);
            if (year < 100) year += 2000;
            const month = parseInt(dateMatch[2]) - 1;
            const day = parseInt(dateMatch[1]);
            
            // Parse time
            const timeMatch = segment.departureTime.match(/(\d{1,2}):(\d{2})/);
            if (!timeMatch) {
                return new Date(year, month, day);
            }
            
            const hours = parseInt(timeMatch[1]);
            const minutes = parseInt(timeMatch[2]);
            
            return new Date(year, month, day, hours, minutes, 0, 0);
        }

        function groupFlightsByJourney(flights) {
            // Group consecutive flights into journeys (outbound, return, etc.)
            // Connected flights (where arrival matches next departure) belong to the same journey
            // Separate journeys are created when flights don't connect or when explicitly returning to origin
            
            if (!flights || flights.length === 0) return [];
            
            const journeys = [];
            let currentJourney = {
                type: 'הלוך',
                date: flights[0]?.date || '',
                segments: [],
                origin: flights[0]?.from || null  // Keep track of journey origin
            };
            
            flights.forEach((flight, idx) => {
                // Add current flight to current journey
                currentJourney.segments.push(flight);
                
                // Check if we should start a new journey
                if (idx < flights.length - 1) {
                    const nextFlight = flights[idx + 1];
                    const lastArrival = (flight.to || '').trim().toUpperCase();
                    const nextDeparture = (nextFlight.from || '').trim().toUpperCase();
                    
                    // Check connection (layover) - flights connect if arrival matches next departure
                    // Use case-insensitive comparison and handle whitespace
                    const isConnection = lastArrival === nextDeparture && lastArrival !== '';
                    
                    // Use arrivalDate if it exists (for midnight crossover cases), otherwise use date
                    const arrivalDateForGap = flight.arrivalDate || flight.date;
                    
                    // Check date gap using the correct arrival date
                    const dateGap = calculateDateGap(arrivalDateForGap, flight.arrivalTime, 
                                                    nextFlight.date, nextFlight.departureTime);
                    const hasSignificantGap = dateGap > 24; // More than 24 hours gap might indicate separate journey
                    const hasReasonableLayover = dateGap >= 0 && dateGap <= 24; // 0-24 hours is a reasonable layover
                    
                    // Debug logging
                    if (isConnection) {
                        console.log(`Connection detected: ${lastArrival} → ${nextDeparture}, gap: ${dateGap.toFixed(2)}h`);
                    } else {
                        console.log(`No connection: ${lastArrival} ≠ ${nextDeparture}, gap: ${dateGap.toFixed(2)}h`);
                    }
                    
                    // Check if this is a return to origin (only relevant if flights don't connect)
                    const isReturnToOrigin = !isConnection && currentJourney.origin && 
                                           (nextFlight.to || '').trim().toUpperCase() === (currentJourney.origin || '').trim().toUpperCase();
                    
                    // If flights connect AND have reasonable layover time, keep them in the same journey
                    // If flights don't connect AND there's a big gap OR return to origin, start new journey
                    if (isConnection && hasReasonableLayover) {
                        // Keep in same journey - do nothing, continue
                    } else if (!isConnection && (hasSignificantGap || isReturnToOrigin)) {
                        // Push current journey and start a new one
                        journeys.push(currentJourney);
                        
                        // Determine type: if returning to origin explicitly, it's 'return'
                        // Otherwise alternate
                        const nextJourneyType = isReturnToOrigin ? 'חזור' : 
                                              (journeys.length % 2 === 1 ? 'חזור' : 'הלוך');
                        
                        currentJourney = {
                            type: nextJourneyType,
                            date: nextFlight.date || '',
                            segments: [],
                            origin: isReturnToOrigin ? nextFlight.to : (currentJourney.origin || nextFlight.from)
                        };
                    } else if (isConnection && hasSignificantGap) {
                        // Even if connected, very long gap (e.g., overnight layover > 24h) might indicate separate journey
                        journeys.push(currentJourney);
                        const nextJourneyType = journeys.length % 2 === 1 ? 'חזור' : 'הלוך';
                        currentJourney = {
                            type: nextJourneyType,
                            date: nextFlight.date || '',
                            segments: [],
                            origin: currentJourney.origin || nextFlight.from
                        };
                    } else if (!isConnection && !hasSignificantGap && !isReturnToOrigin) {
                        // Flights don't connect but gap is small - might still be same journey if airports are close
                        // For now, keep them together if gap is reasonable (less than 24h)
                        // This handles edge cases where airport codes might not match exactly
                    }
                }
            });
            
            // Don't forget to add the last journey
            if (currentJourney.segments.length > 0) {
                journeys.push(currentJourney);
            }
            
            return journeys;
        }
