<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord Tickets - התחברות</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#D4AF37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Google Fonts - Heebo for Hebrew -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #E8C547;
            --gold-dark: #B8960C;
            --navy: #1B365D;
            --navy-light: #2A4A7A;
            --navy-dark: #0F1F3A;
            --white: #FFFFFF;
            --gray-light: #F5F5F5;
            --gray: #E0E0E0;
            --gray-dark: #666666;
            --success: #28A745;
            --error: #DC3545;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            padding: 20px;
        }
        
        .login-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        
        .login-header {
            background: var(--navy-dark);
            padding: 40px 30px;
            text-align: center;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .logo-subtitle {
            color: var(--gold-light);
            font-size: 1rem;
            font-weight: 300;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--navy-dark);
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--gray);
            border-radius: 10px;
            font-family: 'Heebo', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        .form-group input[type="email"],
        .form-group input[type="password"] {
            direction: ltr;
            text-align: left;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-family: 'Heebo', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--gold);
            color: var(--navy-dark);
        }
        
        .btn-primary:hover {
            background: var(--gold-light);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--gray);
            color: var(--gray-dark);
            margin-top: 15px;
        }
        
        .btn-outline:hover {
            background: var(--gray-light);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--gray-dark);
            font-size: 0.9rem;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray);
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .settings-section {
            background: var(--gray-light);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .settings-section h3 {
            font-size: 0.9rem;
            color: var(--navy-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .settings-section .form-group {
            margin-bottom: 10px;
        }
        
        .settings-section input {
            font-size: 0.85rem;
            padding: 10px 12px;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--navy-dark);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .skip-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .skip-link a {
            color: var(--gray-dark);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .skip-link a:hover {
            color: var(--navy);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">Lord Tickets</div>
            <div class="logo-subtitle">מערכת ניהול נוסעים</div>
        </div>
        
        <div class="login-body">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>אימייל</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="material-icons">login</span>
                    התחבר
                </button>
            </form>
            
            <div class="divider"><span>או</span></div>
            
            <button class="btn btn-outline" onclick="continueWithoutAuth()">
                <span class="material-icons">person_outline</span>
                המשך ללא התחברות
            </button>
            
            <!-- Supabase Settings -->
            <div class="settings-section">
                <h3>
                    <span class="material-icons" style="font-size: 1.1rem;">settings</span>
                    הגדרות Supabase
                </h3>
                <div class="form-group">
                    <label>Supabase URL</label>
                    <input type="url" id="supabaseUrl" placeholder="https://xxx.supabase.co" dir="ltr">
                </div>
                <div class="form-group">
                    <label>Supabase API Key</label>
                    <input type="password" id="supabaseKey" placeholder="your-anon-key" dir="ltr">
                </div>
                <button type="button" class="btn btn-outline" onclick="saveSettings()" style="margin-top: 10px;">
                    שמור הגדרות
                </button>
            </div>
            
            <div class="skip-link">
                <a href="inventory.html">חזרה לדף המלאי הישן →</a>
            </div>
        </div>
    </div>
    
    <script>
        // Load saved settings on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('supabaseUrl');
            const savedKey = localStorage.getItem('supabaseKey');
            
            if (savedUrl) document.getElementById('supabaseUrl').value = savedUrl;
            if (savedKey) document.getElementById('supabaseKey').value = savedKey;
            
            // Check if already logged in
            const session = localStorage.getItem('userSession');
            if (session) {
                // Already logged in, redirect
                window.location.href = 'inventory.html';
            }
        });
        
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
        }
        
        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
        }
        
        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<div class="spinner"></div> מתחבר...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-icons">login</span> התחבר';
            }
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const supabaseUrl = document.getElementById('supabaseUrl').value || localStorage.getItem('supabaseUrl');
            const supabaseKey = document.getElementById('supabaseKey').value || localStorage.getItem('supabaseKey');
            
            if (!supabaseUrl || !supabaseKey) {
                showError('נא להזין את הגדרות Supabase');
                return;
            }
            
            setLoading(true);
            
            try {
                // Sign in with Supabase Auth
                const response = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error_description || data.msg || 'Login failed');
                }
                
                // Save session (including refresh_token for automatic renewal)
                localStorage.setItem('userSession', JSON.stringify({
                    access_token: data.access_token,
                    refresh_token: data.refresh_token,
                    user: data.user,
                    expires_at: data.expires_at
                }));
                
                // Also save tokens directly for easier access
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                localStorage.setItem('token_expires_at', String(data.expires_at));
                
                // Save settings
                localStorage.setItem('supabaseUrl', supabaseUrl);
                localStorage.setItem('supabaseKey', supabaseKey);
                
                // Fetch user role from users table
                try {
                    const userResponse = await fetch(
                        `${supabaseUrl}/rest/v1/users?auth_id=eq.${data.user.id}&select=id,name,role,commission_rate`,
                        {
                            headers: {
                                'apikey': supabaseKey,
                                'Authorization': `Bearer ${data.access_token}`
                            }
                        }
                    );
                    
                    if (userResponse.ok) {
                        const userData = await userResponse.json();
                        if (userData.length > 0) {
                            const user = userData[0];
                            localStorage.setItem('userId', user.id);
                            localStorage.setItem('userName', user.name);
                            localStorage.setItem('userRole', user.role);
                            localStorage.setItem('userCommission', user.commission_rate || '0');
                        } else {
                            // User exists in Auth but not in users table - default to agent
                            localStorage.setItem('userRole', 'agent');
                            localStorage.setItem('userName', email.split('@')[0]);
                        }
                    }
                } catch (roleError) {
                    console.error('Error fetching user role:', roleError);
                    localStorage.setItem('userRole', 'agent');
                }
                
                showSuccess('התחברות הצליחה! מעביר...');
                
                setTimeout(() => {
                    window.location.href = 'inventory.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                showError('שגיאה בהתחברות: ' + error.message);
            } finally {
                setLoading(false);
            }
        }
        
        function saveSettings() {
            const url = document.getElementById('supabaseUrl').value;
            const key = document.getElementById('supabaseKey').value;
            
            if (url) localStorage.setItem('supabaseUrl', url);
            if (key) localStorage.setItem('supabaseKey', key);
            
            showSuccess('הגדרות נשמרו בהצלחה');
        }
        
        function continueWithoutAuth() {
            // Allow using the system without authentication (demo mode)
            localStorage.setItem('userSession', JSON.stringify({
                user: { email: 'demo@local' },
                demo: true
            }));
            // Demo mode defaults to admin for full access
            localStorage.setItem('userRole', 'admin');
            localStorage.setItem('userName', 'משתמש הדגמה');
            localStorage.setItem('userId', 'demo-user');
            window.location.href = 'inventory.html';
        }
    </script>
</body>
</html>
